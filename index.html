<meta name="claude:viewport-fit-sides" content="cover">
<title>Agent Investigator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: Duolingo-style shell. Sidebar nav, winding level path, right rail on wide screens; bottom tabs on phones. Black and red, dark only. */
:root{
  --bg:#0a0a0a; --surface:#151515; --surface2:#202020; --line:#3a3a3a;
  --fg:#ffffff; --muted:#c9c9c9; --red:#ff2a2a; --red-dk:#a30f0f; --red-ink:#0a0a0a;
  --gold:#ffc800; --gold-dk:#a37f00; --ok:#4ade80; --ok-dk:#1f8f4a; --bad:#ff8a5c; --bad-dk:#b24a22;
  --font:"Nunito",system-ui,sans-serif; --display:"Space Grotesk","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;font-weight:600;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--font);font-weight:900;margin:0 0 8px;line-height:1.15;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:16px;
  border:2px solid var(--line);border-bottom-width:5px;background:var(--surface2);color:var(--fg);font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn.red{background:var(--red);border-color:var(--red-dk);color:var(--red-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold-dk);color:var(--red-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok-dk);color:var(--red-ink)}
.btn.bad{background:var(--bad);border-color:var(--bad-dk);color:var(--red-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{background:var(--surface2);border-color:var(--line);color:#9a9a9a;cursor:not-allowed}
.btn.sm{min-height:40px;padding:8px 14px;font-size:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.label{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;background:var(--surface)}
.chip.red{border-color:var(--red);color:var(--red)} .chip.gold{border-color:var(--gold);color:var(--gold)} .chip.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh;max-width:1180px;margin:0 auto}
.side{display:none}
.main{min-width:0;padding-block:16px 110px}
.rail{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--line);margin-bottom:12px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums}
.stat.fire{color:#ff9d2a} .stat.coin{color:var(--gold)} .stat.xp{color:var(--red)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid transparent;border-radius:14px;background:none;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:52px}
.tab[aria-current="page"]{border-color:var(--red);color:var(--red);background:rgba(255,42,42,.1)}
@media(min-width:900px){
  body{padding-block:0}
  .shell{grid-template-columns:230px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;padding:24px 0;border-right:2px solid var(--line);padding-right:16px}
  .brandmark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
  .brandmark b{color:var(--red)}
  .sidelink{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:none;text-align:left;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .sidelink:hover{background:var(--surface)}
  .sidelink[aria-current="page"]{border-color:var(--red);color:var(--red);background:rgba(255,42,42,.1)}
  .tabs{display:none}
  .topbar{display:none}
  .main{padding-block:24px 60px}
}
@media(min-width:1180px){
  .shell{grid-template-columns:230px minmax(0,1fr) 320px}
  .rail{display:grid;gap:16px;align-content:start;padding-block:24px;position:sticky;top:0;align-self:start}
}

/* learn path */
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--red);color:var(--red-ink);border-radius:18px;border-bottom:5px solid var(--red-dk);padding:16px 18px;margin:8px 0 22px}
.banner h3{margin:0;font-size:20px} .banner .label{color:#2b0000}
.banner.locked{background:var(--surface2);color:var(--muted);border-bottom-color:var(--line)} .banner.locked .label{color:var(--muted)}
.banner.cleared{background:var(--gold);border-bottom-color:var(--gold-dk)}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:44px 14px}
.node-wrap{position:relative;display:flex;justify-content:center;width:100%}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--red);color:var(--red-ink);
  box-shadow:0 8px 0 var(--red-dk);position:relative;transition:transform .08s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 var(--red-dk)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-dk)}
.node.locked{background:var(--surface2);color:#a5a5a5;box-shadow:0 8px 0 #111;border:2px solid var(--line);cursor:not-allowed}
.node.next::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--red);opacity:.55}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--red-ink);font-weight:900;font-size:13px;letter-spacing:.08em;
  padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--fg);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
.nodelabel{position:absolute;top:84px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;width:170px;left:50%;transform:translateX(-50%)}
.list-ch{display:grid;gap:12px;margin-bottom:18px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px}
.lrow:hover:not(:disabled){border-color:var(--red)}
.lrow:disabled{opacity:.55;cursor:not-allowed}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}
.ico.done{background:var(--gold);color:var(--red-ink)} .ico.next{background:var(--red);color:var(--red-ink)}

/* bars */
.bar{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s}
.bar.gold i{background:var(--gold)}
.week{display:flex;gap:8px;justify-content:space-between}
.day{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:900;color:var(--muted)}
.day.on{background:#ff9d2a;border-color:#b36a00;color:var(--red-ink)}

/* lesson player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.phead{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:860px;width:100%;margin:0 auto}
.xbtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.pbody h2{font-size:26px;margin-bottom:16px}
.tag{display:inline-block;margin-bottom:10px;padding:3px 10px;border-radius:8px;background:var(--surface2);border:2px solid var(--line);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.opts{display:grid;gap:12px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;min-height:58px;font-weight:800}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt.sel{border-color:var(--red);background:rgba(255,42,42,.12)} .opt.sel .k{border-color:var(--red);color:var(--red)}
.opt.right{border-color:var(--ok);background:rgba(74,222,128,.14)} .opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,92,.14)} .opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.readcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px}
.readcard p{font-size:18px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:520px){.pair-grid{grid-template-columns:1fr}}
.pair{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;min-height:56px;font-weight:800;font-size:15px}
.pair.sel{border-color:var(--red);background:rgba(255,42,42,.12)}
.pair.ok{border-color:var(--ok);background:rgba(74,222,128,.14);opacity:.75}
.pair.no{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pfoot{border-top:2px solid var(--line);background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pfoot.good{background:#0f2a18;border-top-color:var(--ok)} .pfoot.bad{background:#2b1710;border-top-color:var(--bad)}
.pfoot-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto}
.fb{min-width:0;flex:1 1 260px}
.fb strong{display:block;font-size:20px;font-weight:900}
.fb.good strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.done-screen{text-align:center;display:grid;gap:18px;justify-items:center;padding-top:10px}
.score3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:480px}
.score3 div{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--surface)}
.score3 b{display:block;font-size:24px;font-variant-numeric:tabular-nums}

/* landing */
.land{max-width:1000px;margin:0 auto;padding-block:20px 60px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding-block:40px}
@media(min-width:800px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:16px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{font-size:19px;max-width:46ch}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.feat h3{margin-top:10px}
.section{padding-block:28px}

/* setup */
.setup{max-width:640px;margin:0 auto;padding-block:30px 60px;display:grid;gap:18px}
.pick{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;min-height:72px}
.pick:hover,.pick[aria-pressed="true"]{border-color:var(--red)}
.pick strong{display:block;font-size:18px;margin-bottom:2px}
.pick small{font-size:14px;color:var(--muted);font-weight:700}
input[type=text]{font:inherit;font-weight:800;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:52px;width:100%;min-width:0}
input[type=text]:focus{border-color:var(--red)}
.stepdots{display:flex;gap:8px}
.stepdots i{flex:1;height:8px;border-radius:99px;background:var(--surface2)} .stepdots i.on{background:var(--red)}

/* cards, grids */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.badge{display:grid;gap:6px;justify-items:center;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-size:12px;font-weight:800;min-width:0}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--red-ink);border-bottom:5px solid var(--gold-dk)}
.badge.off{opacity:.6} .badge.off .medal{background:var(--surface2);color:#aaa;border-bottom-color:#111}
.avatar{display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);border-radius:20px;padding:14px}
.avatar svg{width:170px;max-width:100%;height:auto}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--red)}
.optbtn{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:900;font-size:13px}
.optbtn[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.shopcard{display:grid;gap:10px;justify-items:stretch;text-align:center;align-content:start}
.shopcard .avatar svg{width:100px;height:auto}
.q-row{display:grid;gap:8px}
.qtitle{display:flex;justify-content:space-between;gap:10px;font-weight:900}
.board{display:grid;gap:8px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.brow.me{border-color:var(--red);background:rgba(255,42,42,.1)}
.rank{width:30px;font-weight:900;text-align:center;color:var(--muted)}
.mini-av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--surface2);flex:none;display:grid;place-items:center}
.mini-av svg{width:44px;height:auto}
.cert{border:4px double var(--gold);border-radius:20px;padding:34px 18px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center}
.cert h2{color:var(--gold);font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--red-ink);padding:10px 18px;border-radius:14px;font-weight:900;max-width:calc(100% - 32px);display:none;z-index:80;border-bottom:4px solid var(--gold-dk)}
.toast.show{display:block}
@media(min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- game layer ---- */
.hud{display:grid;gap:10px;margin-bottom:16px}
.hud-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hearts{display:flex;gap:4px;color:var(--red)}
.hearts .off{color:#444}
.enemy{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.enemy .ehead{width:44px;height:44px;border-radius:12px;background:var(--red-dk);color:#fff;display:grid;place-items:center;flex:none}
.enemy.boss .ehead{background:#000;border:2px solid var(--red);color:var(--red)}
.ehp{height:14px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.ehp i{display:block;height:100%;background:var(--red);transition:width .3s}
.tbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold)}
.tbar i.low{background:var(--red)}
.combo{display:inline-flex;align-items:center;gap:6px;color:#ff9d2a;font-weight:900}
.hit{animation:hit .4s}
@keyframes hit{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rise{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.story{display:grid;gap:14px;justify-items:center;text-align:center}
.bubble-talk{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px 20px;font-size:18px;max-width:560px;text-align:left}
.bubble-talk::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.dossier{width:100%;max-width:560px;border:2px dashed var(--red);border-radius:16px;padding:14px;text-align:left;background:rgba(255,42,42,.06)}
.tfcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.tfcard .term{font-size:26px;font-weight:900;margin-bottom:8px;color:var(--gold)}
.tfcard .says{font-size:19px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.fchip{border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);padding:10px 14px;font-weight:800;text-align:left;min-height:48px}
.fchip.on{border-color:var(--red);background:rgba(255,42,42,.14)}
.pbox{border:2px dashed var(--line);border-radius:16px;padding:16px;background:var(--surface2);font-weight:700;min-height:70px;overflow-wrap:anywhere}
.meter{height:20px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);transition:width .25s}
.meter.full i{background:var(--ok)}
.hline{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px;margin-bottom:10px;font-weight:700;min-height:56px}
.hline.sel{border-color:var(--red);background:rgba(255,42,42,.12)}
.hline.fake{border-color:var(--bad);background:rgba(255,138,92,.16)}
.hline.ok{border-color:var(--ok)}
.report{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);margin-bottom:12px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.slot{width:42px;height:50px;border-radius:10px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);display:grid;place-items:center;font-weight:900;font-size:22px}
.slot.sp{border:0;background:none;width:14px}
.slot.full{border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:48px;height:56px;border-radius:12px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface2);font-weight:900;font-size:22px}
.tile:disabled{opacity:.25}
.clue{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:18px;text-align:center}

  ['Machine learning','In machine learning, the software improves by studying many examples instead of following hand-written rules.','What does a machine learning system learn from?','Many examples',['A single rule book','Its own opinions','Random guessing only'],'Examples, called training data, are how the system learns.'],
  ['Generative AI','Generative AI makes new text, images, code or audio based on patterns it has seen.','Which tool is generative AI?','A chatbot that writes a poem',['A calculator','A clock app','A file zipper'],'It creates new content instead of only sorting or finding it.'],
  ['Large language models','A large language model predicts the next word again and again, which lets it write fluent text.','How does a language model produce a sentence?','By predicting likely next words',['By looking it up in a hidden book','By thinking like a person','By copying one website'],'It predicts words from patterns, so fluent does not mean true.'],
  ['Image and audio AI','Image and audio AI turns a written request into pictures, music or voices, and can also recognize them.','Face unlock on a phone uses which kind of AI?','Image recognition',['Text generation','Spreadsheet formulas','Voice cloning only'],'It compares your face to a stored pattern.'],
  ['Recommendation AI','Streaming and video apps use AI to guess what you will want next from what you and others watched.','Why does a video app show you similar videos?','AI predicts what you will like from past behavior',['It reads your mind','Videos pick themselves','A person chooses each one live'],'Recommendations come from patterns in watch history.'],
  ['Predictive AI','Predictive AI estimates what will happen, such as traffic delays or weather, from past data.','A map app estimating arrival time is using what?','Predictive AI',['Generative art','A random number','A paper map'],'It predicts travel time from past and live traffic data.'],
  ['Hallucinations','AI sometimes states false things in a confident tone. These mistakes are called hallucinations.','What is an AI hallucination?','A confident answer that is false',['A bright image','A slow response','A saved file'],'Confident wording is not proof. Always check important facts.'],
  ['AI in daily life','You already meet AI in maps, spam filters, photo apps and recommendations. Naming it helps you question it.','Which of these usually uses AI?','Auto-suggested replies in a messaging app',['A paper notebook','A wall clock','A light switch'],'Suggested replies are predicted by AI from your text.']
  ]},
responsible:{name:'Using AI Responsibly', blurb:'Responsible use means you stay in charge, protect people and check the work.',
  terms:[['Citation','A note that credits where info came from'],['Personal data','Details that identify a person'],['Verify','Check a claim against a trusted source'],['Disclosure','Saying that you used AI']],
  labs:[['Your teacher allows AI for brainstorming only. You want ideas for a science fair topic.',['Write my science fair project report','Give me 10 science fair topic ideas about water quality. I will pick one and do the work myself.','Do my homework'],1,'It stays inside the allowed use and keeps the work yours.'],
        ['You want to share your class notes with an AI tool for study help.',['Here are my notes with my name, address and school ID. Quiz me.','Here are my notes with names removed. Quiz me.','Quiz me on my friend Maya\'s private diary.'],1,'Remove personal details before sharing anything.']],
  steps:[
  ['You are in charge','AI is a tool. You decide what to use, what to change and what to leave out. Your name goes on the work.','Who is responsible for work you submit that used AI?','You are',['The AI company','The AI itself','Nobody'],'Your name is on the work, so you own it.'],
  ['Know the rules','Schools and teachers set rules for AI. Read them before you start, and ask when they are unclear.','What should you do before using AI on an assignment?','Check what your teacher allows',['Assume everything is allowed','Hide it from your teacher','Ask the AI for permission'],'Rules differ by class, so check each time.'],
  ['Protect personal data','Do not paste passwords, addresses, ID numbers or other people\'s private details into AI tools.','Which should you never paste into an AI tool?','A password',['A fun fact','A public quote','A math problem'],'Anything you paste may be stored or seen by others.'],
  ['Check facts','AI can be wrong. Check names, dates, numbers and quotes in a trusted source before you use them.','An AI gives a statistic for your report. What is the next step?','Find the statistic in a trusted source',['Use it as is','Make the number bigger','Delete the report'],'Verified facts are the only ones you should use.'],
  ['Give credit','If AI helped, follow your school\'s rule for saying so. If it used someone\'s ideas, credit the original.','Why disclose that you used AI?','It is honest and often required',['It makes your work longer','It removes all mistakes','It is only for adults'],'Honesty builds trust and follows many school rules.'],
  ['Watch for bias','AI learns from human data, so it can repeat unfair patterns. Look for who is missing or stereotyped.','An AI story only shows one kind of person as a hero. What should you notice?','The answer may reflect bias',['It is perfectly fair','It is a law','It is random'],'Bias in data can show up in outputs.'],
  ['Do not pretend','Submitting AI-written work as your own is cheating in most classes, even if no one finds out.','Which use is cheating?','Submitting AI-written text as your own',['Asking AI to explain a hard idea','Using AI to check your grammar when allowed','Having AI quiz you'],'Passing off AI work as yours is dishonest.'],
  ['Safe sharing','Think before you upload photos or voices of people. You need their permission, and some things should not be shared.','Before uploading a friend\'s photo to an AI tool you should…','Ask their permission',['Post it first','Edit their face without asking','Ignore it'],'People control how their images are used.'],
  ['Learn, do not outsource','Use AI to help you understand, then test yourself. If you cannot explain it, you have not learned it.','Which use helps you learn most?','Asking it to explain, then explaining it back',['Copying every answer','Skipping the reading','Having it take the test'],'Explaining back checks real understanding.'],
  ['Report problems','If AI gives harmful, false or creepy output, stop, save a note of it and tell a teacher or adult.','What should you do if an AI tool gives harmful advice?','Stop and tell a trusted adult',['Follow it','Share it widely','Ask it again 20 times'],'Getting an adult involved keeps you safe.']
  ]},
brainstorm:{name:'AI for Brainstorming', blurb:'AI is great at volume. You are great at choosing, so use it to get unstuck.',
  terms:[['Brainstorm','Generate many ideas without judging them'],['Constraint','A limit that shapes ideas'],['Remix','Combine ideas into something new'],['Shortlist','The few ideas you choose to explore']],
  labs:[['You need ideas for a club fundraiser at school.',['Fundraiser ideas','Give me 12 fundraiser ideas for a school robotics club with a $200 budget. Mix cheap and creative ones.','Plan my whole fundraiser and write the email'],1,'It gives a number, a context and a limit, and keeps the choice with you.'],
        ['You are stuck on a story idea.',['Write my story','Story','Give me 8 story starters about a student who finds a coded message. Vary the genres.'],2,'Asking for starters keeps the writing yours.']],
  steps:[
  ['Ideas first, judge later','Brainstorming works best when you collect many ideas before you judge any of them.','What is the goal of brainstorming?','Collect many ideas before judging',['Find one perfect idea fast','Write the final project','Avoid weird ideas'],'Volume first, filtering second.'],
  ['Ask for quantity','Ask for 10 or 20 options. The strange ones near the end are often the most useful.','Which request gives you more to work with?','"Give me 15 ideas for a poster theme"',['"A poster idea"','"Idea"','"Just one"'],'A number pushes past the obvious first ideas.'],
  ['Add constraints','Limits like budget, time or audience make ideas more useful and less generic.','Which adds a helpful constraint?','"for a $50 budget and two weeks"',['"something nice"','"anything"','"cool"'],'Constraints give AI something to design against.'],
  ['Set a role','Tell the AI who it should be, such as a coach or a skeptical teacher, to change the angle of ideas.','Why give the AI a role?','It changes the angle of the ideas',['It makes it smarter','It removes errors','It speeds up the internet'],'Roles steer tone and perspective.'],
  ['Remix ideas','Combine two ideas from the list and ask AI to blend them. New ideas often sit between old ones.','What does "remix" mean in brainstorming?','Combine ideas into a new one',['Delete the list','Make it louder','Copy a friend'],'Blending two options can create a fresh third.'],
  ['Ask for opposites','Ask for the worst ideas, then flip them. It can unlock fresh ones.','Why ask for bad ideas?','Flipping them can reveal good ones',['To waste time','To trick the AI','To get more errors'],'Seeing what to avoid clarifies what to do.'],
  ['Pick with criteria','Choose ideas with a short list of criteria such as cost, time and impact. Do not just pick the first.','How should you choose from a long list?','Compare against clear criteria',['Pick the first one','Let the AI choose alone','Pick the longest one'],'Criteria make the choice fair and explainable.'],
  ['Credit your own thinking','The best idea is usually one you shaped. Add your own twist before you commit.','What makes an AI-suggested idea yours?','You adapt it with your own thinking',['You copy it exactly','You hide where it came from','You rename it'],'Your changes and choices are the real contribution.'],
  ['Mind map it','Ask AI to cluster ideas into groups, then draw them as a map to spot patterns.','What does clustering ideas help you see?','Patterns and themes',['Spelling errors','Passwords','Page count'],'Groups reveal themes you can build on.'],
  ['Know when to stop','Once you have a shortlist, stop generating and start doing. More ideas can become a way to avoid work.','When should you stop brainstorming?','When you have a shortlist worth testing',['Never','After one idea','When the AI is tired'],'Action beats endless idea collecting.']
  ]},
planning:{name:'AI for Planning', blurb:'A plan turns a goal into steps. AI drafts the steps. You make them real.',
  terms:[['Milestone','A checkpoint on the way to a goal'],['Deadline','The date something must be done'],['Priority','What matters most right now'],['Buffer','Extra time for surprises']],
  labs:[['You have a history project due in 3 weeks and a soccer season.',['Make me a schedule','Build a 3-week plan for a 10-page history project. I have practice Mon, Wed, Fri after school. Include 1 buffer day.','Do my project'],1,'It gives the deadline, the limits and a buffer.'],
        ['You want to study for finals.',['Study plan','I have 5 finals in 10 days: math, bio, English, history, Spanish. Make a daily plan with 90 minutes per day and extra time for math.','Make my grades go up'],1,'It includes the goal, the time and the priority.']],
  steps:[
  ['Start with the goal','A good plan begins with a clear goal and a date. Tell the AI both.','Which is the best starting point for a plan?','A clear goal and a deadline',['A random list','A long story','A guess'],'The goal and date shape every step.'],
  ['Break it into steps','Ask AI to split a big task into small steps you can finish in one sitting.','Why break a project into small steps?','They are easier to start and finish',['They take more time','They make the project bigger','They remove deadlines'],'Small steps reduce overwhelm.'],
  ['Set milestones','Milestones are checkpoints. They show if you are on track before it is too late.','What is a milestone?','A checkpoint toward the goal',['A final grade','A break','A tool'],'Checkpoints keep a plan honest.'],
  ['Estimate time','AI can guess how long tasks take, but it does not know you. Adjust the estimates.','Why adjust an AI time estimate?','It does not know your pace',['It is always right','It ignores deadlines','It cannot count'],'You know your speed and schedule best.'],
  ['Add buffer','Plans slip. A buffer day or hour keeps one delay from ruining everything.','Why include a buffer?','Things take longer than planned',['To make the plan look long','To skip work','To fool a teacher'],'Buffers absorb surprises.'],
  ['Set priorities','Not everything matters equally. Ask AI to rank tasks by importance and effort, then check the ranking.','What does prioritizing do?','Puts important tasks first',['Deletes tasks','Adds tasks','Makes tasks easier'],'Time goes first to what matters most.'],
  ['Use your calendar','Give the AI your fixed commitments so it plans around them, then copy the plan into your own calendar.','What should you tell the AI before it builds a schedule?','Your fixed commitments',['Your password','Nothing','Your favorite color'],'Fixed events limit available time.'],
  ['Check the plan','Read every step. Does it fit your life, your rules and your deadline? Fix what does not.','After the AI drafts a plan, you should…','Review and fix it',['Follow it blindly','Delete it','Share it unseen'],'You own the plan, so check it.'],
  ['Track progress','Tick off steps as you go. Tell the AI what slipped and ask for an updated plan.','What should you do when a step slips?','Update the plan',['Ignore it','Quit','Hide it'],'Plans work when they adapt.'],
  ['Plan with others','For group work, ask AI to split tasks by strengths, then agree on it with your team.','Who must agree on a group plan?','The whole team',['Only the AI','Only one person','Nobody'],'A plan only works if people commit to it.']
  ]}
});
Object.assign(TOPICS, {
writing:{name:'AI for Writing', blurb:'AI can help you draft and polish. Your voice and your ideas stay yours.',
  terms:[['Outline','A skeleton of your main points'],['Thesis','The main claim of an essay'],['Revision','Improving a draft after writing it'],['Voice','The style that sounds like you']],
  labs:[['You wrote a rough paragraph and want feedback, not a rewrite.',['Rewrite this','Fix it','Give me 3 specific suggestions to improve clarity in this paragraph. Do not rewrite it.'],2,'Asking for suggestions keeps the writing yours.'],
        ['You need an outline for an essay on school start times.',['Write the essay','Make an outline for a 5-paragraph persuasive essay arguing school should start later. Use my thesis: "Later starts improve sleep and grades."','Essay on school'],1,'It names the format, the position and your own thesis.']],
  steps:[
  ['Draft vs. final','AI can speed up a first draft, but the final piece should reflect your thinking and be checked by you.','Who should shape the final version of your essay?','You',['The AI alone','Nobody','A stranger'],'Your thinking and edits make it yours.'],
  ['Start with an outline','Ask AI to build an outline from your thesis. Then reorder it to fit your argument.','What is an outline?','A skeleton of your main points',['A final grade','A citation','A font'],'It organizes ideas before you write.'],
  ['Write your own thesis','Your thesis is your claim. Write it yourself first, then test it with AI as a debate partner.','Who should write your thesis?','You, then test it with AI',['AI only','A classmate','Nobody'],'The claim is your core idea.'],
  ['Get feedback, not rewrites','Ask for comments on clarity and structure. Rewrite the sentences yourself.','Which request keeps the writing yours?','"Point out unclear sentences"',['"Rewrite my essay"','"Write a better one"','"Do it all"'],'Feedback builds your skill.'],
  ['Protect your voice','If everything sounds smooth and generic, pull some of your own phrases back in.','Why protect your voice?','Your voice makes writing sound like you',['Voice is wrong','AI has no voice','Teachers hate voice'],'Distinct writing is memorable and honest.'],
  ['Check grammar smartly','Use AI to flag errors, then learn the rule. Do not accept every change without reading.','What should you do with AI grammar fixes?','Review each one',['Accept all','Ignore all','Hide them'],'Not every suggestion fits your meaning.'],
  ['Fact-check claims','AI can invent quotes and facts. Check any claim you did not write from a source you trust.','AI adds a quote to your essay. What now?','Verify the quote in a real source',['Keep it','Change the name','Make it longer'],'Fake quotes damage your credibility.'],
  ['Cite properly','If you use ideas or text from sources, cite them. Follow your class\'s rule for AI help.','Why cite sources?','To give credit and prove claims',['To pad length','To confuse readers','It is optional always'],'Citations show where information came from.'],
  ['Tone and audience','Tell the AI who you are writing for. A letter to a principal sounds different than a text to a friend.','Why tell AI the audience?','Tone depends on who reads it',['It slows the AI','It adds errors','It hides facts'],'Audience shapes word choice.'],
  ['Revise in rounds','Revise in passes: ideas first, structure next, sentences last.','What is a good revision order?','Ideas, then structure, then sentences',['Sentences only','Fonts first','Spelling only'],'Fixing big things first avoids wasted polish.']
  ]},
research:{name:'AI for Research', blurb:'AI can point you to ideas and sources. Only real sources can prove them.',
  terms:[['Primary source','A first-hand record from the time'],['Reliable source','One with expertise and accountability'],['Cross-check','Compare a claim across several sources'],['Bias','A leaning that colors information']],
  labs:[['You are researching the causes of the water cycle for a report.',['Water cycle','Explain the water cycle in 5 steps for a 9th grader and list 3 trusted sites I can read to confirm it.','Write my report'],1,'It asks for a clear explanation and sources to verify.'],
        ['AI gives you a source link that does not open.',['Use it anyway','Search for the title in a library database and confirm it exists before citing.','Make up a new link'],1,'If you cannot find it, do not cite it.']],
  steps:[
  ['AI is a starting point','Use AI to get oriented on a topic, then move to real sources for evidence.','What is AI best used for early in research?','Getting oriented on a topic',['Replacing sources','Proving facts alone','Citing itself'],'It is a guide, not a source.'],
  ['Good search questions','Narrow, specific questions give better results than broad ones.','Which is a better research question?','"How did the 1918 flu affect school closures?"',['"History"','"Flu"','"Tell me stuff"'],'Specific questions lead to focused answers.'],
  ['Check sources exist','AI can invent sources. Always search for the title, author and link yourself.','What should you do with an AI-listed source?','Confirm it exists',['Cite it unchecked','Guess the page','Skip it'],'Fake sources are a common AI error.'],
  ['Reliable sources','Look for experts, evidence and a clear owner. Libraries, journals and official sites are strong picks.','Which source is usually most reliable?','A peer-reviewed journal or official agency',['An anonymous post','A random video','A meme'],'Accountable sources are more trustworthy.'],
  ['Cross-check claims','If three good sources agree, your confidence goes up. If they disagree, dig deeper.','Why cross-check?','Agreement across sources builds trust',['To waste time','To find typos','To copy'],'Multiple good sources reduce error risk.'],
  ['Spot bias','Every source has a view. Ask who made it, why, and what they might leave out.','What is a good bias question?','Who made this and why?',['What font is it?','How long is it?','What color is it?'],'Knowing the maker clarifies the angle.'],
  ['Take notes','Write notes in your own words and track where each idea came from.','Why record the source of each note?','So you can cite it later',['To fill space','To hide ideas','To slow down'],'Tracking sources avoids accidental plagiarism.'],
  ['Summaries need checking','AI summaries can drop key details or add wrong ones. Skim the original too.','What should you do with an AI summary?','Compare it to the original',['Trust it fully','Ignore it','Share it unseen'],'Summaries can distort.'],
  ['Date and context','Information gets old. Check the date and whether it still applies.','Why check the date of a source?','Facts can be outdated',['Dates are pretty','It is a rule for fun','Old is always best'],'Recent data matters for fast-changing topics.'],
  ['Cite and credit','List every source you used, including how AI helped if your school asks.','What belongs in your citations?','Each source you actually used',['Only sources you liked','Random links','Nothing'],'Credit shows honest work.']
  ]},
comms:{name:'AI for Communication', blurb:'Clear messages build trust. AI can help with wording. You choose the words that are true.',
  terms:[['Tone','The attitude of a message'],['Audience','Who will read or hear it'],['Clarity','Easy to understand at first read'],['Call to action','What you want the reader to do']],
  labs:[['You need to email a teacher to ask for an extension.',['Write an email','Draft a polite 4-sentence email asking Ms. Lee for a 2-day extension on my lab report because of a family event. Keep it honest and short.','Make an excuse'],1,'It is honest, specific and sets a tone and length.'],
        ['You want to apply for a volunteer role.',['Write a message about me','Help me write a short intro for a volunteer application using these true facts: I tutor math, I speak Spanish and I can work Saturdays.','Say I have 5 years of experience'],1,'Use true facts only.']],
  steps:[
  ['Know your goal','Before writing, know what you want the reader to do or understand.','What should you decide first?','What you want the reader to do or know',['Font size','Emoji count','Length only'],'Purpose guides the message.'],
  ['Know your audience','A message to a teacher differs from a message to a friend.','Why does audience matter?','It sets tone and detail',['It sets the font','It sets the date','It does not matter'],'Readers need different things.'],
  ['Be clear and short','Put the main point first and cut extra words.','What goes first in a good message?','The main point',['A long story','A joke','The signature'],'Readers decide quickly.'],
  ['Choose a tone','Ask AI for a polite, confident or warm version, then pick what sounds like you.','Who decides the final tone?','You',['AI','Nobody','Strangers'],'You must stand behind the words.'],
  ['Stay truthful','AI can make you sound impressive. Never add claims that are not true.','What should you do with AI-made claims about you?','Delete anything untrue',['Keep them','Add more','Ignore them'],'Honesty protects trust.'],
  ['Check the facts','Check names, dates and promises in AI-drafted messages.','What must you check before sending?','Names, dates and promises',['Only the greeting','Only emojis','Nothing'],'Errors look careless.'],
  ['Practice difficult talks','Use AI to rehearse an awkward conversation, then talk to the real person.','What is AI good for in a hard conversation?','Rehearsing what to say',['Replacing the talk','Hiding from it','Avoiding the person'],'Practice builds confidence.'],
  ['Translate with care','AI translation helps, but idioms and tone can go wrong. Ask a speaker when it matters.','Why double-check translations?','Tone and idioms can be wrong',['Translations are perfect','Words never change','It is a rule'],'Meaning can shift between languages.'],
  ['Keep private things private','Do not paste private messages or personal details into AI to rewrite.','What should you avoid pasting?','Private messages with personal info',['A public speech','A generic sentence','A topic name'],'Private info should stay private.'],
  ['Own your message','You press send. Read it aloud once. If it does not sound like you, edit it.','What is the last step before sending?','Read it and edit it',['Press send','Add emojis','Forward it'],'You are accountable for the message.']
  ]},
ethics:{name:'Using AI Ethically', blurb:'Ethics asks not just "can I?" but "should I?" and "who could this affect?"',
  terms:[['Bias','Unfair patterns in data or results'],['Transparency','Being open about how AI was used'],['Accountability','Taking responsibility for outcomes'],['Consent','Permission from the people involved']],
  labs:[['A classmate asks you to use an AI tool to copy a student\'s artwork style and sell it.',['Do it, it is quick money','Say no, explain the artist\'s rights and suggest making original art','Ignore the question'],1,'Respect creators and their work.'],
        ['You find an AI tool that flags students as likely cheaters. It is wrong a lot.',['Trust it fully','Report the errors and ask for human review before anyone is punished','Hide the errors'],1,'Humans must review decisions that affect people.']],
  steps:[
  ['Can vs. should','A tool being able to do something does not mean you should use it that way.','Which question is more ethical?','"Should I use it this way?"',['"Can I get away with it?"','"Is it fast?"','"Is it free?"'],'Ethics looks at impact, not only ability.'],
  ['Fairness','AI can treat groups unfairly when its data is skewed. Look for who gets left out.','What is a sign of unfair AI?','It works worse for some groups',['It is fast','It is new','It is popular'],'Uneven results can signal bias.'],
  ['Privacy','People deserve control over their data and images. Ask before you use someone else\'s.','Before using a person\'s photo in AI you should…','Get their consent',['Assume yes','Crop their name','Post it'],'Consent protects people.'],
  ['Transparency','Say when AI helped. Hiding it makes others trust you less.','Why be open about using AI?','It builds trust',['It is boring','It is required by law everywhere','It slows work'],'Openness respects the people who rely on your work.'],
  ['Accountability','If AI work causes harm, the person who used it is still responsible.','Who answers for harm from AI-made work you shared?','You do',['The AI','The internet','Nobody'],'Tools do not take responsibility.'],
  ['Misinformation','AI can make fake news and fake images that look real. Do not spread them.','What should you do with a suspicious AI image?','Check it before sharing',['Share it fast','Edit it more','Post it twice'],'Verification stops harm.'],
  ['Deepfakes','Fake videos or voices of real people can hurt them. Making or sharing them without consent is harmful and often illegal.','Is it OK to make a fake voice of a classmate as a joke?','No, it can harm them',['Yes if it is funny','Yes if it is short','Yes if no one sees'],'Consent and harm matter more than the joke.'],
  ['Creators and credit','AI may learn from artists\' work. Credit and respect creators, and follow rules on use.','What does respecting creators mean?','Credit them and follow usage rules',['Copy their work','Remove their names','Ignore licenses'],'Creators deserve credit and fair treatment.'],
  ['Environmental cost','AI uses energy and water. Use it with purpose, not for pointless repeats.','Why consider AI\'s energy use?','Large AI systems use real resources',['It uses none','It is free','It is magic'],'Thoughtful use reduces waste.'],
  ['Speak up','If you see harmful or unfair AI use, tell someone who can help.','What can you do about unfair AI use?','Report it to a trusted adult or team',['Ignore it','Copy it','Hide it'],'Speaking up helps fix problems.']
  ]}
});
Object.assign(TOPICS, {
problem:{name:'AI for Problem Solving', blurb:'Good problem solving starts with a clear question. AI helps you explore. You decide.',
  terms:[['Root cause','The real reason a problem happens'],['Hypothesis','A testable guess'],['Trade-off','Gaining one thing by giving up another'],['Iterate','Try, learn and improve in loops']],
  labs:[['Your team app crashes when users upload large photos.',['It is broken, fix it','Our app crashes on uploads over 5 MB. Give me 5 likely causes ranked by probability and a quick test for each.','Rewrite the whole app'],1,'It describes the symptom, the condition and asks for tests.'],
        ['You must choose between two study apps for your school club.',['Which is better?','Compare App A and App B for a 20-student club on cost, privacy, ease of use and offline use. Use a table, then ask me what matters most.','App A'],1,'It sets the criteria and keeps the final choice with you.']],
  steps:[
  ['Define the problem','State the problem in one sentence before asking for solutions.','What comes first in problem solving?','State the problem clearly',['Pick a tool','Pick a color','Start coding'],'A clear problem prevents wasted work.'],
  ['Ask for causes','Ask AI for possible root causes, then test them one at a time.','Why ask for several causes?','The first guess may be wrong',['To waste time','To confuse you','To get a longer answer'],'Testing options finds the real one.'],
  ['Break it down','Split a big problem into smaller ones you can solve in order.','Why split a big problem?','Small parts are easier to solve',['It hides the problem','It removes the deadline','It makes the AI faster'],'Decomposition reduces complexity.'],
  ['Test hypotheses','A hypothesis is a testable guess. Design a quick test before you invest hours.','What is a hypothesis?','A testable guess',['A final answer','A rule','A password'],'You prove or drop it with a test.'],
  ['Weigh trade-offs','Every option gives up something. Ask AI to list pros and cons, then decide with your priorities.','What is a trade-off?','Gaining one thing by giving up another',['A free win','A rule','A bug'],'Seeing costs helps choose well.'],
  ['Show your work','Share what you tried so AI can help with your real situation instead of guessing.','What improves AI help on a problem?','Sharing what you already tried',['Hiding the details','Asking vaguely','Using caps lock'],'Context leads to relevant answers.'],
  ['Challenge the answer','Ask the AI to argue against its own answer. Weak points show up fast.','Why ask AI to argue against its answer?','It reveals weak spots',['It makes the AI sad','It stops the task','It adds errors'],'Counterarguments test the idea.'],
  ['Verify solutions','Run the solution on a small case before you rely on it.','What should you do before using a solution widely?','Test it on a small case',['Ship it','Trust it','Hide it'],'Small tests catch failures early.'],
  ['Iterate','If it does not work, change one thing and test again. Keep notes.','What is iteration?','Try, learn and improve in loops',['Quit after one try','Change everything at once','Skip testing'],'Changing one thing at a time shows what works.'],
  ['Know when to ask a human','Some problems need a teacher, a mentor or an expert. Ask early when stakes are high.','When should you ask a person for help?','When the stakes are high or you are stuck',['Never','Only after failing','Only on weekends'],'People bring context AI lacks.']
  ]},
prompting:{name:'How to Prompt AI', blurb:'A prompt is a brief. The clearer the brief, the better the work you get back.',
  terms:[['Prompt','The instructions you give an AI'],['Context','Background the AI needs to help'],['Format','The shape of the answer you want'],['Follow-up','A next message that refines the result']],
  labs:[['You need a study guide on photosynthesis.',['photosynthesis','Make a study guide on photosynthesis for 9th grade biology: 5 key terms, a 4-step summary and 3 practice questions with answers.','Explain everything'],1,'It names the audience, format and parts.'],
        ['The AI gave a long answer. You wanted shorter.',['Bad answer','Shorter','Rewrite that in 3 bullet points of 12 words or fewer each.'],2,'Specific limits get the result you want.']],
  steps:[

    ${path !== 'fieldagent' ? `<button class="btn red" data-act="advance">Advance to ${esc(PATHS[ORDER[ORDER.indexOf(path)+1]].name)}</button>` : '<span class="chip gold">Highest clearance reached</span>'}</div>`;
}

        }

      }
      h += '</div>';
    } else {
      h += `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Chapter ${ch+1}: ${esc(T.name)}</h3><span class="chip ${cleared?'ok':''}">${cnt}/10</span></div><p class="muted" style="margin:6px 0 12px">${esc(T.blurb)}</p><div class="list-ch" style="margin:0">`;

    const v = Math.min(S.q[q.key], q.goal), ready = v >= q.goal, claimed = !!S.q.claimed[q.id];
    const reward = gameOn() ? `${q.coins} coins` : '10 XP';
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(q.name)}</h3><span class="chip gold">${reward}</span></div>
      <div class="bar gold" style="margin:12px 0"><i style="width:${v/q.goal*100}%"></i></div>
      <div class="row" style="justify-content:space-between"><span class="muted">${v} of ${q.goal}</span>
      <button class="btn sm ${ready&&!claimed?'gold':''}" data-act="claim" data-id="${q.id}" ${(!ready||claimed)?'disabled':''}>${claimed?'Claimed':'Claim'}</button></div></div>`;
  }).join('');

/* ---------- obby v2: obstacle course engine ---------- */
const OBH = 540, GRAV = 2300, JUMPV = 840, SPEED = 330, STEP = 1/120, SPRINGV = 1250;
const OB = {camY:0, active:false, ch:0, w:null, p:null, keys:{}, cam:0, t:0, acc:0, last:0, raf:0, paused:false, done:false, near:null, cp:null, stats:{deaths:0, coins:0, t:0}, msgT:0, bg:[], stars:[], parts:[], shake:0, flash:0};
const clampN = (v,a,b) => Math.max(a, Math.min(b, v));
const hit = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
BADGES.push({id:'obby', name:'Course Clear', hint:'Finish an obstacle course', icon:'flame'});
const OB_COL = ['#ff2a2a','#ff9d2a','#ffc800','#4ade80','#2fe0d0','#4dabff','#b388ff','#ff6bb5'];

function genCourse(path, ch){
  const r = rng(dseed(path+':'+ch)*13 + 5), L = ch;
  const W = {plats:[], spikes:[], lasers:[], coins:[], gates:[], flags:[], springs:[], spawn:[], portal:null, end:0};
  let cid = 0, x = 0, y = 430;
  const solid = (px, py, pw, t) => { const o = {t:t||'s', x:px, y:py, w:pw, h:(t==='m'?22:46), st:0, tm:0}; W.plats.push(o); return o; };
  const coin = (cx, cy) => W.coins.push({id:cid++, x:cx, y:cy});
  solid(-400, y, 1000); x = 600; W.spawn.push({x:120, y, sec:0});
  for(let s=0; s<10; s++){
    const diff = L + s*0.35, n = 2 + Math.floor(L/3) + (s > 3 ? 1 : 0);
    const avail = ['gap','gap','stairs'];
    if(L > 0 || s >= 2) avail.push('spikes');
    if(L >= 1 && s >= 1) avail.push('mover');
    if(L >= 1 && s >= 1) avail.push('spring');
    if(L >= 2 && s >= 2) avail.push('crumble');
    if(L >= 4 && s >= 2) avail.push('pillars');
    if(L >= 3 && s >= 1) avail.push('laser');
    for(let k=0; k<n; k++){
      let type = avail[Math.floor(r()*avail.length)];
      if(y < 330) type = 'drop'; else if(type === 'spring' && y < 400) type = 'gap';
      if(type === 'gap'){
        let g = 70 + Math.min(100, diff*9); const nw = 150 + r()*110, ny = clampN(y + (r()*130 - 65), 260, 450); if(ny < y) g = Math.min(g, 125);
        const gx = x + g; solid(gx, ny, nw); coin(x + g/2, Math.min(y, ny) - 95); x = gx + nw; y = ny;
      } else if(type === 'drop'){
        const gx = x + 80, ny = Math.min(450, y + 120); solid(gx, ny, 220); coin(gx + 110, ny - 70); x = gx + 220; y = ny;
      } else if(type === 'stairs'){
        const dir = (y > 400) ? -1 : (r() < .5 ? -1 : 1);
        for(let q=0; q<3; q++){ const ny = clampN(y + dir*50, 260, 450), gx = x + 55; solid(gx, ny, 100); coin(gx + 50, ny - 55); x = gx + 100; y = ny; }
      } else if(type === 'spikes'){
        const two = L >= 3, gx = x + 60, w = two ? 660 : 480; solid(gx, y, w);
        W.spikes.push({x:gx + 230, y, w:90}); if(two) W.spikes.push({x:gx + 500, y, w:90});
        coin(gx + 275, y - 125); if(two) coin(gx + 545, y - 125); x = gx + w;
      } else if(type === 'mover'){
        const gapW = 280, mid = x + gapW/2, ax = (gapW - 130 - 30)/2;
        const m = solid(mid - 65, y, 130, 'm'); m.cx = mid; m.ax = ax; m.sp = 0.8 + Math.min(.6, diff*0.06); m.ph = r()*6; m.dx = 0;
        const gx = x + gapW; solid(gx, y, 240); coin(mid, y - 95); x = gx + 240;
      } else if(type === 'crumble'){
        let cx = x;
        for(let q=0; q<3; q++){ const gx = cx + 75; solid(gx, y, 110, 'c'); coin(gx + 55, y - 60); cx = gx + 110; }
        const gx = cx + 75; solid(gx, y, 170); x = gx + 170;
      } else if(type === 'laser'){
        const gx = x + 80, w = 440; solid(gx, y, w);
        W.lasers.push({x:gx + 220, y1:y - 190, y2:y, period:2.4 - Math.min(.8, L*.1), off:r()*2});
        coin(gx + 80, y - 40); coin(gx + w - 80, y - 40); x = gx + w;
      } else if(type === 'pillars'){
        let cx = x, py = y;
        for(let q=0; q<3; q++){ const gx = cx + 100, ny = clampN(py + (q%2 ? 35 : -35), 300, 450); solid(gx, ny, 130); coin(gx + 65, ny - 60); cx = gx + 130; py = ny; }
        const gx = cx + 100; solid(gx, py, 200); x = gx + 200; y = py;
      } else if(type === 'spring'){
        const gx = x + 70, w = 250; solid(gx, y, w); W.springs.push({x:gx + w - 80, y, w:50, t:0});
        const bx = gx + w + 150, ny = y - 190; solid(bx, ny, 230); coin(gx + w + 40, ny - 40); coin(bx + 115, ny - 60); x = bx + 230; y = ny;
      }
      if(k === Math.floor(n/2)){ const lp = W.plats[W.plats.length-1]; W.flags.push({x:lp.x + Math.min(40, lp.w/2), y:lp.y, sec:s}); }
    }
    const gx = x + 90, w = 340; solid(gx, y, w);
    W.gates.push({s, tx:gx + 70, ty:y, bx:gx + w - 60, open:isDone(ch*10 + s), anim:isDone(ch*10 + s) ? 1 : 0});
    W.spawn.push({x:gx + 20, y, sec:s+1}); x = gx + w;
  }
  const px = x + 120; solid(px, y, 320); W.portal = {x:px + 160, y}; W.end = px + 320;
  return W;
}
const openCount = () => { let n = 0; while(n < 10 && isDone(OB.ch*10 + n)) n++; return n; };
function obSpawn(){ const n = openCount(); let sp = OB.w.spawn[n]; if(OB.cp && OB.cp.sec >= n) sp = OB.cp; return sp; }
function obRespawn(){ const sp = obSpawn(); const p = OB.p; p.x = sp.x; p.y = sp.y - p.h; p.vx = 0; p.vy = 0; p.onGround = false; p.ride = null; p.dead = 0;
  OB.w.plats.forEach(o => { if(o.t === 'c'){ o.st = 0; o.tm = 0; } }); OB.cam = p.x - 160; }
function obBurst(x, y, n, col, sp, up){ for(let i=0; i<n; i++){ const a = Math.random()*6.283, v = (.3 + Math.random())*sp; OB.parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - (up||0), life:.5 + Math.random()*.5, max:1, c:col, s:2 + Math.random()*3}); } }
function obDie(){

/* physics */
function obStepPhys(dt){
  const p = OB.p, W = OB.w, K = OB.keys; OB.t += dt; OB.stats.t += dt;
  W.plats.forEach(m => {
    if(m.t === 'm'){ const nx = m.cx + Math.sin(OB.t*m.sp + m.ph)*m.ax - m.w/2; m.dx = nx - m.x; m.x = nx; }
    else if(m.t === 'c'){ if(m.st === 1){ m.tm -= dt; if(m.tm <= 0){ m.st = 2; m.tm = 2.4; } } else if(m.st === 2){ m.tm -= dt; if(m.tm <= 0){ m.st = 0; } } }
  });
  W.springs.forEach(sp => { if(sp.t > 0) sp.t -= dt; });
  W.gates.forEach(g => { const to = g.open ? 1 : 0; g.anim += (to - g.anim)*Math.min(1, dt*6); });
  OB.parts.forEach(q => { q.life -= dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 900*dt; }); OB.parts = OB.parts.filter(q => q.life > 0);
  if(p.dead > 0){ p.dead -= dt; if(p.dead <= 0) obRespawn(); return; }
  if(p.ride && p.ride.dx) p.x += p.ride.dx;
  const dir = (K.right ? 1 : 0) - (K.left ? 1 : 0), target = dir*SPEED, acc = p.onGround ? 3400 : 2400;
  if(p.vx < target) p.vx = Math.min(target, p.vx + acc*dt); else if(p.vx > target) p.vx = Math.max(target, p.vx - acc*dt);
  if(dir) p.face = dir;
  p.coyote = p.onGround ? .12 : p.coyote - dt;
  if(K.jumpPressed){ p.buf = .14; K.jumpPressed = false; }
  p.buf -= dt;
  if(p.buf > 0 && p.coyote > 0){ p.vy = -JUMPV; p.coyote = 0; p.buf = 0; p.onGround = false; sfx('click'); obBurst(p.x + p.w/2, p.y + p.h, 6, '#bbb', 120, 40); }
  if(p.vy >= 0) p.sprung = false; if(!K.jump && !p.sprung && p.vy < -260) p.vy += 3400*dt;
  p.vy = Math.min(1200, p.vy + GRAV*dt);

  solids.forEach(s => { if(hit(p, s)){ if(p.vx > 0 || (p.vx === 0 && p.x + p.w/2 < s.x + s.w/2)) p.x = s.x - p.w; else p.x = s.x + s.w; p.vx = 0; } });
  p.y += p.vy*dt; const wasGround = p.onGround, fall = p.vy; p.onGround = false; p.ride = null;
  solids.forEach(s => {
    if(hit(p, s)){
      if(p.vy >= 0){ p.y = s.y - p.h; p.vy = 0; p.onGround = true; if(!s.bar) p.ride = s; if(s.t === 'c' && s.st === 0){ s.st = 1; s.tm = .45; } if(!wasGround){ p.land = .14; if(fall > 500) obBurst(p.x + p.w/2, p.y + p.h, 8, '#ccc', 150, 50); } }
      else { p.y = s.y + s.h; p.vy = 0; }
    }
  });
  if(p.land > 0) p.land -= dt;
  if(p.onGround && Math.abs(p.vx) > 200 && Math.random() < dt*14) obBurst(p.x + p.w/2 - p.face*8, p.y + p.h, 1, '#999', 60, 20);
  W.springs.forEach(sp => { if(p.onGround && Math.abs(p.y + p.h - sp.y) < 4 && p.x + p.w > sp.x && p.x < sp.x + sp.w){ p.vy = -SPRINGV; p.sprung = true; p.onGround = false; p.coyote = 0; sp.t = .3; sfx('good'); obBurst(sp.x + sp.w/2, sp.y, 14, '#ffc800', 220, 160); } });
  const body = {x:p.x + 4, y:p.y + 4, w:p.w - 8, h:p.h - 6};
  if(!S.assist){
    W.spikes.forEach(sp => { if(hit(body, {x:sp.x + 5, y:sp.y - 24, w:sp.w - 10, h:24})) obDie(); });
    W.lasers.forEach(l => { const on = ((OB.t + l.off) % l.period) < l.period*.5; if(on && hit(body, {x:l.x - 4, y:l.y1, w:8, h:l.y2 - l.y1})) obDie(); });
  }
  if(p.y > 585) obDie();

}

function obChar(g, p){

  limb(-12, -33 + bob, 6, 17, air ? -2.3 : -sw*.9, skin); 
  g.fillStyle = o[0]; g.beginPath(); g.roundRect ? g.roundRect(-12, -36 + bob, 24, 24, 5) : g.rect(-12, -36 + bob, 24, 24); g.fill();
  g.fillStyle = o[1]; g.fillRect(-2, -36 + bob, 4, 24);
  limb(12, -33 + bob, 6, 17, air ? 2.3 : sw*.9, skin);
  g.fillStyle = skin; g.beginPath(); g.arc(0, -44 + bob, 10, 0, 7); g.fill();
  if(e.hair === 'long'){ g.fillStyle = hc; g.fillRect(-11, -50 + bob, 7, 24); }
  g.fillStyle = hc; g.beginPath(); g.arc(0, -46 + bob, 10.5, Math.PI*1.02, Math.PI*1.98); g.fill();
  if(e.hair === 'curly'){ g.beginPath(); g.arc(-8, -50 + bob, 5, 0, 7); g.arc(0, -55 + bob, 6, 0, 7); g.arc(8, -50 + bob, 5, 0, 7); g.fill(); }
  if(e.hair === 'bun'){ g.beginPath(); g.arc(0, -57 + bob, 5, 0, 7); g.fill(); }
  g.fillStyle = '#000'; g.fillRect(3, -45 + bob, 2.5, 3);
  if(e.acc === 'acc-shades' || e.acc === 'acc-visor'){ g.fillStyle = e.acc === 'acc-visor' ? '#ff2a2a' : '#000'; g.fillRect(-1, -47 + bob, 12, 5); }
  if(e.acc === 'acc-mask'){ g.fillStyle = '#000'; g.fillRect(-9, -47 + bob, 20, 5); }
  if(e.acc === 'acc-hat'){ g.fillStyle = '#222'; g.fillRect(-14, -53 + bob, 28, 4); g.fillRect(-8, -61 + bob, 16, 9); }
  if(e.acc === 'acc-ear'){ g.fillStyle = '#ff2a2a'; g.beginPath(); g.arc(-9, -43 + bob, 2.5, 0, 7); g.fill(); }
  g.restore();
}

const obHash = (x, y, s) => { let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(s|0, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

function playerNext(){

    const end = +m[1], suf = m[2], t0 = performance.now(), dur = 900; if(end < 2) return;
    (function f(t){ const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); n.nodeValue = Math.round(end*e) + suf; if(k<1) requestAnimationFrame(f); })(t0);

  closePal(); const items = palItems(); let sel = 0, shown = items;
  const d = document.createElement('div'); d.id = 'pal'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label','Quick jump');
  d.innerHTML = '<div class="palbox"><input id="palq" placeholder="Jump to a page, level or study guide…" autocomplete="off" aria-label="Search"><div class="pallist" id="pall"></div><p class="hint" style="margin:10px 0 0">Up and down to move · Enter to open · Esc to close</p></div>';
  document.body.appendChild(d);
  const list = d.querySelector('#pall'), q = d.querySelector('#palq');
  function draw(){ list.innerHTML = shown.length ? shown.map((x,k)=>'<button class="palit '+(k===sel?'on':'')+'" data-k="'+k+'">'+ic(x[0],20)+'<span class="grow"><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></span></button>').join('') : '<p class="muted" style="padding:12px">Nothing found.</p>'; const on = list.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'}); }
  function run(k){ const x = shown[k]; if(!x) return; closePal(); x[3](); }
  q.addEventListener('input', () => { const s = q.value.toLowerCase().trim(); shown = items.filter(x => (x[1]+' '+x[2]).toLowerCase().includes(s)); sel = 0; draw(); });
  q.addEventListener('keydown', e => { if(e.key === 'ArrowDown'){ sel = Math.min(shown.length-1, sel+1); draw(); e.preventDefault(); } else if(e.key === 'ArrowUp'){ sel = Math.max(0, sel-1); draw(); e.preventDefault(); } else if(e.key === 'Enter'){ run(sel); } });
  list.addEventListener('click', e => { const b = e.target.closest('.palit'); if(b) run(+b.dataset.k); });
  d.addEventListener('click', e => { if(e.target === d) closePal(); });
  draw(); q.focus();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closePal(); return; }
  const tg = (e.target.tagName || '').toLowerCase(); if(tg === 'input' || tg === 'textarea') return;
  if(V.player || (typeof OB !== 'undefined' && OB.active) || !S.setup || S.step !== 'app') return;
  if(e.key === 'k' || e.key === 'K' || e.key === '/'){ e.preventDefault(); openPal(); }
});
document.addEventListener('pointermove', e => { const c = e.target.closest && e.target.closest('.glass,.card,.crs,.lvl,.cx-card,.hubt,.shopcard,.how>div'); if(!c) return; const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX-r.left)+'px'); c.style.setProperty('--my', (e.clientY-r.top)+'px'); });
function boot(){
  if(V.booted || S.step !== 'app' || (navigator.webdriver && !window.FORCEBOOT) || (window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)) return; V.booted = true;
  const L = ['AGENT TERMINAL v2.6','Authenticating '+(S.user||'agent')+' ... OK','Loading missions ... OK','Syncing streak and coins ... OK','Welcome back, agent.'];
  const d = document.createElement('div'); d.id = 'boot'; d.innerHTML = '<div class="bootbox">'+L.map((l,k)=>'<div style="animation-delay:'+(k*.28)+'s">'+(k?'&gt; ':'')+esc(l)+'</div>').join('')+'<div class="bootbar"><i></i></div></div>';
  document.body.appendChild(d); const rm = () => { d.classList.add('out'); setTimeout(()=>d.remove(), 450); }; d.addEventListener('click', rm); setTimeout(rm, 1900);
}
/* ---------- typewriter ---------- */
function typeAsk(){
  clearTimeout(window._tw); const el = document.querySelector('#app .ask'); if(!el) return;
  let list; try { list = JSON.parse(el.dataset.p); } catch(e){ return; } const out = el.querySelector('.tw'); if(!out || list.length < 2) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  let i = 0, n = list[0].length, dir = -1;
  function step(){ if(!document.body.contains(el)) return; const s = list[i];
    out.textContent = s.slice(0, n);
    if(dir === 1){ if(n < s.length){ n++; window._tw = setTimeout(step, 45); } else { dir = -1; window._tw = setTimeout(step, 2200); } }
    else { if(n > 0){ n--; window._tw = setTimeout(step, 22); } else { i = (i+1) % list.length; dir = 1; window._tw = setTimeout(step, 250); } } }
  window._tw = setTimeout(step, 2500);
}
/* ---------- base render ---------- */
function renderBase(){
  const app = document.getElementById('app');
  let h = '';
  if(S.step === 'landing' || (!S.user && S.step !== 'name')) h = viewLanding();
  else if(S.step === 'name') h = viewName();
  else if(S.step === 'mode') h = viewMode();
  else if(S.step === 'track') h = viewTrack();
  else if(S.step === 'char' && gameOn()) h = viewChar();
  else {
    if(S.tab === 'shop' && !gameOn()) S.tab = 'hq';
    const views = {hq:viewHQ, learn:viewLearn, manual:viewManual, quests:viewQuests, board:viewBoard, shop:viewShop, agent:viewAgent};
    h = shell((views[S.tab] || viewHQ)());
  }
  const vk = S.step+'|'+S.tab; app.classList.toggle('enter', V.lastView !== vk); V.lastView = vk;
  app.innerHTML = h;
  countUp();
  if(V.scrollNext){ V.scrollNext = false; const n = app.querySelector('.node.next') || app.querySelector('.lrow .chip.red'); if(n && S.tab === 'learn') n.scrollIntoView({block:'center'}); }
}
function render(){ renderBase(); renderPlayer(); }

/* ---------- events ---------- */
document.addEventListener('submit', e => {
  if(e.target.id !== 'nameForm') return;
  e.preventDefault();
  const v = document.getElementById('codename').value.trim();
  if(!v) return;
  S.user = v.slice(0,20); S.step = S.setup ? 'app' : 'mode'; save(); render(); window.scrollTo(0,0);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act, d = b.dataset, p = V.player;
  /* player actions return early */
  if(a === 'choose'){ if(p && !p.checked && !p.hidden.includes(+d.k)){ p.sel = +d.k; sfx('click'); renderPlayer(); } return; }
  if(a === 'check'){ playerCheck(); return; }
  if(a === 'next'){ playerNext(); return; }
  if(a === 'pt'){ playerMatch('t', +d.k); return; }
  if(a === 'pd'){ playerMatch('d', +d.k); return; }
  if(a === 'quit'){ closePlayer(); return; }
  if(a === 'retry'){ const L = p.lesson; if(L.type === 'daily') V.player = newPlayer(buildDaily()); else if(L.type === 'duel') V.player = newPlayer(buildDuel(RIVALS.findIndex(r=>r[0]===L.rival.name))); else V.player = newPlayer(buildLesson(S.path, L.i)); renderPlayer(); return; }
  if(a === 'manual-from-fail'){ const id = p.lesson.topicId; closePlayer(); S.tab = 'manual'; S.manual = id; save(); render(); window.scrollTo(0,0); return; }
  if(a === 'tfans'){ if(p && !p.checked){ const s = p.queue[0], v = d.v === '1'; p.sel = +d.v; resolve(v === s.truth, esc(s.why)); } return; }
  if(a === 'fchip'){ const s = p.queue[0]; s._f.sel[+d.k] = !s._f.sel[+d.k]; sfx('click'); renderPlayer(); return; }
  if(a === 'forgesend'){ forgeSend(); return; }
  if(a === 'hline'){ const s = p.queue[0]; s._h.sel = +d.k; sfx('click'); renderPlayer(); return; }
  if(a === 'hcheck'){ const s = p.queue[0]; const ok = s.lines[s._h.sel].fake; resolve(ok, (ok ? '' : 'The forged line is highlighted. ') + esc(s.why)); return; }
  if(a === 'tile'){ codeTile(+d.k); return; }
  if(a === 'cback'){ const s = p.queue[0]; s._c.ans.pop(); renderPlayer(); return; }
  if(a === 'hint'){
    if(p && !p.checked && S.hints > 0){ const s = p.queue[0]; const c = s.opts.map((o,k)=>k).filter(k=>s.opts[k] !== s.ans && !p.hidden.includes(k));
      if(c.length && s.opts.length - p.hidden.length > 2){ p.hidden.push(c[Math.floor(Math.random()*c.length)]); S.hints--; save(); if(p.sel !== null && p.hidden.includes(p.sel)) p.sel = null; renderPlayer(); } }
    return;
  }
  if(a === 'open'){ openLesson(+d.i); return; }
  if(a === 'dispatch'){ openDaily(); return; }
  if(a === 'pal'){ openPal(); return; }
  if(a === 'goon'){ const ni = nextIdx(); if(ni !== -1){ if(gameOn()) startCourse(Math.floor(ni/10)); else openLesson(ni); return; } S.tab = 'learn'; }
  if(a === 'course'){ startCourse(+d.ch); return; }
  if(a === 'obquit'){ quitCourse(); return; }
  if(a === 'obpause'){ obPause(true); return; }
  if(a === 'obresume'){ obPause(false); return; }
  if(a === 'obact'){ obAct(); return; }
  if(a === 'obnext'){ stopCourse(); startCourse(+d.ch); return; }
  if(a === 'duel'){ openDuel(+d.r); return; }
  /* app actions */
  if(a === 'start'){ S.step = S.setup ? 'app' : 'name'; }
  if(a === 'enter'){ S.step = S.setup ? 'app' : 'name'; }
  if(a === 'mode'){ S.mode = d.m; S.step = 'track'; }
  if(a === 'track'){ S.path = d.p; if(S.setup) S.step = 'app'; else if(gameOn()) S.step = 'char'; else { S.setup = true; S.step = 'app'; } S.tab = 'hq'; }
  if(a === 'finishsetup'){ S.setup = true; S.step = 'app'; S.tab = 'hq'; }
  if(a === 'tab'){ S.tab = d.t; if(d.t === 'learn') V.scrollNext = true; window.scrollTo(0,0); }
  if(a === 'manual'){ S.manual = d.id || null; S.tab = 'manual'; window.scrollTo(0,0); }
  if(a === 'shoptab'){ S.shopTab = d.t; }
  if(a === 'set'){ S.equip[d.k] = (d.k === 'acc' && d.v === '') ? null : d.v; sfx('click'); }
  if(a === 'equip'){ const it = SHOP.find(x=>x.id===d.id); if(it.kind === 'outfit') S.equip.outfit = it.id; else S.equip.acc = (S.equip.acc === it.id ? null : it.id); sfx('click'); }
  if(a === 'buy'){
    const it = SHOP.find(x=>x.id===d.id);
    if(it && S.coins >= it.price){
      if(it.kind === 'boost'){ S.coins -= it.price; if(it.id === 'boost-freeze') S.freezes++; else if(it.id === 'boost-hint') S.hints += 3; else S.armor++; sfx('coin'); toast('Bought '+it.name); }
      else if(!S.owned.includes(it.id)){ S.coins -= it.price; S.owned.push(it.id); S.bought++; grant('shopper'); if(it.kind === 'outfit') S.equip.outfit = it.id; else S.equip.acc = it.id; sfx('coin'); toast('Bought '+it.name); }
    }
  }
  if(a === 'chest'){ const ck = S.path+':'+d.ch; if(!S.chests[ck]){ S.chests[ck] = true; S.coins += 20; S.hints++; sfx('coin'); toast('Supply crate: +20 coins and a hint'); confetti(); } }
  if(a === 'claim'){ ensureQuest(); const q = QUESTS.find(x=>x.id===d.id); if(q && S.q[q.key] >= q.goal && !S.q.claimed[q.id]){ S.q.claimed[q.id] = true; if(gameOn()) S.coins += q.coins; else addXp(10); grant('quest'); sfx('coin'); toast('Reward claimed'); } }
  if(a === 'advance'){ const nx = ORDER[ORDER.indexOf(S.path)+1]; if(nx){ S.path = nx; S.tab = 'learn'; V.scrollNext = true; toast('Welcome to the '+PATHS[nx].name+' track'); confetti(); } }
  if(a === 'switchmode'){ S.mode = gameOn() ? 'regular' : 'game'; S.tab = 'hq'; }
  if(a === 'retrack'){ S.step = 'track'; }
  if(a === 'signout'){ S = JSON.parse(JSON.stringify(DEF)); V.player = null; }
  if(a === 'togsound'){ S.sound = S.sound === false; }
  if(a === 'togassist'){ S.assist = !S.assist; }
  if(a === 'togtimer'){ S.noTimer = !S.noTimer; }
  if(a === 'resetask'){ S.confirmReset = true; }
  if(a === 'resetno'){ S.confirmReset = false; }
  if(a === 'reset'){ S = JSON.parse(JSON.stringify(DEF)); V.player = null; }
  save(); render();
});
try { render(); } catch(err){ console.error(err); S = JSON.parse(JSON.stringify(DEF)); try { save(); } catch(x){} V.player = null; render(); }
</script>
