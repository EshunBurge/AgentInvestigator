<meta name="claude:viewport-fit-sides" content="cover">
<title>Agent Investigator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: Duolingo-style shell. Sidebar nav, winding level path, right rail on wide screens; bottom tabs on phones. Black and red, dark only. */
:root{
  --bg:#0a0a0a; --surface:#151515; --surface2:#202020; --line:#3a3a3a;
  --fg:#ffffff; --muted:#c9c9c9; --red:#ff2a2a; --red-dk:#a30f0f; --red-ink:#0a0a0a;
  --gold:#ffc800; --gold-dk:#a37f00; --ok:#4ade80; --ok-dk:#1f8f4a; --bad:#ff8a5c; --bad-dk:#b24a22;
  --font:"Nunito",system-ui,sans-serif; --display:"Space Grotesk","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;font-weight:600;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--font);font-weight:900;margin:0 0 8px;line-height:1.15;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:16px;
  border:2px solid var(--line);border-bottom-width:5px;background:var(--surface2);color:var(--fg);font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn.red{background:var(--red);border-color:var(--red-dk);color:var(--red-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold-dk);color:var(--red-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok-dk);color:var(--red-ink)}
.btn.bad{background:var(--bad);border-color:var(--bad-dk);color:var(--red-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{background:var(--surface2);border-color:var(--line);color:#9a9a9a;cursor:not-allowed}
.btn.sm{min-height:40px;padding:8px 14px;font-size:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.label{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;background:var(--surface)}
.chip.red{border-color:var(--red);color:var(--red)} .chip.gold{border-color:var(--gold);color:var(--gold)} .chip.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh;max-width:1180px;margin:0 auto}
.side{display:none}
.main{min-width:0;padding-block:16px 110px}
.rail{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--line);margin-bottom:12px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums}
.stat.fire{color:#ff9d2a} .stat.coin{color:var(--gold)} .stat.xp{color:var(--red)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid transparent;border-radius:14px;background:none;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:52px}
.tab[aria-current="page"]{border-color:var(--red);color:var(--red);background:rgba(255,42,42,.1)}
@media(min-width:900px){
  body{padding-block:0}
  .shell{grid-template-columns:230px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;padding:24px 0;border-right:2px solid var(--line);padding-right:16px}
  .brandmark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
  .brandmark b{color:var(--red)}
  .sidelink{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:none;text-align:left;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
  .sidelink:hover{background:var(--surface)}
  .sidelink[aria-current="page"]{border-color:var(--red);color:var(--red);background:rgba(255,42,42,.1)}
  .tabs{display:none}
  .topbar{display:none}
  .main{padding-block:24px 60px}
}
@media(min-width:1180px){
  .shell{grid-template-columns:230px minmax(0,1fr) 320px}
  .rail{display:grid;gap:16px;align-content:start;padding-block:24px;position:sticky;top:0;align-self:start}
}

/* learn path */
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--red);color:var(--red-ink);border-radius:18px;border-bottom:5px solid var(--red-dk);padding:16px 18px;margin:8px 0 22px}
.banner h3{margin:0;font-size:20px} .banner .label{color:#2b0000}
.banner.locked{background:var(--surface2);color:var(--muted);border-bottom-color:var(--line)} .banner.locked .label{color:var(--muted)}
.banner.cleared{background:var(--gold);border-bottom-color:var(--gold-dk)}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:44px 14px}
.node-wrap{position:relative;display:flex;justify-content:center;width:100%}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--red);color:var(--red-ink);
  box-shadow:0 8px 0 var(--red-dk);position:relative;transition:transform .08s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 var(--red-dk)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-dk)}
.node.locked{background:var(--surface2);color:#a5a5a5;box-shadow:0 8px 0 #111;border:2px solid var(--line);cursor:not-allowed}
.node.next::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--red);opacity:.55}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--red-ink);font-weight:900;font-size:13px;letter-spacing:.08em;
  padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--fg);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
.nodelabel{position:absolute;top:84px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;width:170px;left:50%;transform:translateX(-50%)}
.list-ch{display:grid;gap:12px;margin-bottom:18px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px}
.lrow:hover:not(:disabled){border-color:var(--red)}
.lrow:disabled{opacity:.55;cursor:not-allowed}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}
.ico.done{background:var(--gold);color:var(--red-ink)} .ico.next{background:var(--red);color:var(--red-ink)}

/* bars */
.bar{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s}
.bar.gold i{background:var(--gold)}
.week{display:flex;gap:8px;justify-content:space-between}
.day{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:900;color:var(--muted)}
.day.on{background:#ff9d2a;border-color:#b36a00;color:var(--red-ink)}

/* lesson player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.phead{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:860px;width:100%;margin:0 auto}
.xbtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.pbody h2{font-size:26px;margin-bottom:16px}
.tag{display:inline-block;margin-bottom:10px;padding:3px 10px;border-radius:8px;background:var(--surface2);border:2px solid var(--line);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.opts{display:grid;gap:12px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;min-height:58px;font-weight:800}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt.sel{border-color:var(--red);background:rgba(255,42,42,.12)} .opt.sel .k{border-color:var(--red);color:var(--red)}
.opt.right{border-color:var(--ok);background:rgba(74,222,128,.14)} .opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,92,.14)} .opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.readcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px}
.readcard p{font-size:18px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:520px){.pair-grid{grid-template-columns:1fr}}
.pair{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;min-height:56px;font-weight:800;font-size:15px}
.pair.sel{border-color:var(--red);background:rgba(255,42,42,.12)}
.pair.ok{border-color:var(--ok);background:rgba(74,222,128,.14);opacity:.75}
.pair.no{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pfoot{border-top:2px solid var(--line);background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pfoot.good{background:#0f2a18;border-top-color:var(--ok)} .pfoot.bad{background:#2b1710;border-top-color:var(--bad)}
.pfoot-in{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto}
.fb{min-width:0;flex:1 1 260px}
.fb strong{display:block;font-size:20px;font-weight:900}
.fb.good strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.done-screen{text-align:center;display:grid;gap:18px;justify-items:center;padding-top:10px}
.score3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:480px}
.score3 div{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--surface)}
.score3 b{display:block;font-size:24px;font-variant-numeric:tabular-nums}

/* landing */
.land{max-width:1000px;margin:0 auto;padding-block:20px 60px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding-block:40px}
@media(min-width:800px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin-bottom:16px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{font-size:19px;max-width:46ch}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.feat h3{margin-top:10px}
.section{padding-block:28px}

/* setup */
.setup{max-width:640px;margin:0 auto;padding-block:30px 60px;display:grid;gap:18px}
.pick{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;min-height:72px}
.pick:hover,.pick[aria-pressed="true"]{border-color:var(--red)}
.pick strong{display:block;font-size:18px;margin-bottom:2px}
.pick small{font-size:14px;color:var(--muted);font-weight:700}
input[type=text]{font:inherit;font-weight:800;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:52px;width:100%;min-width:0}
input[type=text]:focus{border-color:var(--red)}
.stepdots{display:flex;gap:8px}
.stepdots i{flex:1;height:8px;border-radius:99px;background:var(--surface2)} .stepdots i.on{background:var(--red)}

/* cards, grids */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.badge{display:grid;gap:6px;justify-items:center;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-size:12px;font-weight:800;min-width:0}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--red-ink);border-bottom:5px solid var(--gold-dk)}
.badge.off{opacity:.6} .badge.off .medal{background:var(--surface2);color:#aaa;border-bottom-color:#111}
.avatar{display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);border-radius:20px;padding:14px}
.avatar svg{width:170px;max-width:100%;height:auto}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--red)}
.optbtn{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:900;font-size:13px}
.optbtn[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.shopcard{display:grid;gap:10px;justify-items:stretch;text-align:center;align-content:start}
.shopcard .avatar svg{width:100px;height:auto}
.q-row{display:grid;gap:8px}
.qtitle{display:flex;justify-content:space-between;gap:10px;font-weight:900}
.board{display:grid;gap:8px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.brow.me{border-color:var(--red);background:rgba(255,42,42,.1)}
.rank{width:30px;font-weight:900;text-align:center;color:var(--muted)}
.mini-av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--surface2);flex:none;display:grid;place-items:center}
.mini-av svg{width:44px;height:auto}
.cert{border:4px double var(--gold);border-radius:20px;padding:34px 18px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center}
.cert h2{color:var(--gold);font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--red-ink);padding:10px 18px;border-radius:14px;font-weight:900;max-width:calc(100% - 32px);display:none;z-index:80;border-bottom:4px solid var(--gold-dk)}
.toast.show{display:block}
@media(min-width:900px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- game layer ---- */
.hud{display:grid;gap:10px;margin-bottom:16px}
.hud-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hearts{display:flex;gap:4px;color:var(--red)}
.hearts .off{color:#444}
.enemy{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.enemy .ehead{width:44px;height:44px;border-radius:12px;background:var(--red-dk);color:#fff;display:grid;place-items:center;flex:none}
.enemy.boss .ehead{background:#000;border:2px solid var(--red);color:var(--red)}
.ehp{height:14px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.ehp i{display:block;height:100%;background:var(--red);transition:width .3s}
.tbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold)}
.tbar i.low{background:var(--red)}
.combo{display:inline-flex;align-items:center;gap:6px;color:#ff9d2a;font-weight:900}
.hit{animation:hit .4s}
@keyframes hit{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rise{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.story{display:grid;gap:14px;justify-items:center;text-align:center}
.bubble-talk{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px 20px;font-size:18px;max-width:560px;text-align:left}
.bubble-talk::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.dossier{width:100%;max-width:560px;border:2px dashed var(--red);border-radius:16px;padding:14px;text-align:left;background:rgba(255,42,42,.06)}
.tfcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.tfcard .term{font-size:26px;font-weight:900;margin-bottom:8px;color:var(--gold)}
.tfcard .says{font-size:19px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.fchip{border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);padding:10px 14px;font-weight:800;text-align:left;min-height:48px}
.fchip.on{border-color:var(--red);background:rgba(255,42,42,.14)}
.pbox{border:2px dashed var(--line);border-radius:16px;padding:16px;background:var(--surface2);font-weight:700;min-height:70px;overflow-wrap:anywhere}
.meter{height:20px;border-radius:99px;border:2px solid var(--line);background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);transition:width .25s}
.meter.full i{background:var(--ok)}
.hline{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px;margin-bottom:10px;font-weight:700;min-height:56px}
.hline.sel{border-color:var(--red);background:rgba(255,42,42,.12)}
.hline.fake{border-color:var(--bad);background:rgba(255,138,92,.16)}
.hline.ok{border-color:var(--ok)}
.report{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);margin-bottom:12px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.slot{width:42px;height:50px;border-radius:10px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);display:grid;place-items:center;font-weight:900;font-size:22px}
.slot.sp{border:0;background:none;width:14px}
.slot.full{border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:48px;height:56px;border-radius:12px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface2);font-weight:900;font-size:22px}
.tile:disabled{opacity:.25}
.clue{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:18px;text-align:center}

/* animation */

@keyframes tickin{from{opacity:0}to{opacity:1}}

.enter :is(.stage,.phead,.how,.sect,.bento,.grid-auto,.lvl-grid,.stack,.main,.grid2,.hqgrid)>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}

.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(1){animation-delay:.02s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(2){animation-delay:.08s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(3){animation-delay:.14s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(4){animation-delay:.2s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(5){animation-delay:.26s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(6){animation-delay:.32s}
.enter :is(.bento,.grid-auto,.lvl-grid,.stack,.main,.how,.grid2)>*:nth-child(n+7){animation-delay:.38s}
.enter .bar i{transform-origin:left;animation:fillx 1.1s .35s cubic-bezier(.2,.8,.2,1) backwards}
.enter .vb i,.enter .hb i{transform-origin:bottom;animation:filly .9s .45s cubic-bezier(.2,.8,.2,1) backwards}

/* ---- round 3: more color, detail, motion, tech ---- */
.main.c-orange{--c:#ff9d2a;--rgb:255,157,42}.main.c-blue{--c:#4dabff;--rgb:77,171,255}.main.c-gold{--c:#ffc800;--rgb:255,200,0}.main.c-green{--c:#4ade80;--rgb:74,222,128}.main.c-pink{--c:#ff6bb5;--rgb:255,107,181}.main.c-purple{--c:#b388ff;--rgb:179,136,255}
:is(.card,.shopcard,.brow,.case,.cert,.lrow,.mission-box,.how>div,.glass,.cx-card,.crs,.lvl,.tile-stat):not(.stage){background:linear-gradient(155deg,rgba(var(--rgb,255,255,255),.2),rgba(var(--rgb,255,255,255),.05) 55%,rgba(255,255,255,.02));border-color:rgba(var(--rgb,255,255,255),.45);box-shadow:0 0 26px rgba(var(--rgb,0,0,0),.14),0 10px 36px rgba(0,0,0,.35)}

.main h1{background:linear-gradient(90deg,#fff 30%,var(--c,#ff8a6b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage h1{background:linear-gradient(90deg,#fff,#ffb199 45%,#ff4b3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hn{background:linear-gradient(135deg,#ff4b3a,#ff9d2a)}
.how>div:nth-child(2) .hn{background:linear-gradient(135deg,#4dabff,#2fe0d0)}.how>div:nth-child(3) .hn{background:linear-gradient(135deg,#ffc800,#4ade80)}
/* drifting colored orbs */
#app::before,#app::after{content:"";position:fixed;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(30px)}
#app::before{left:-160px;top:18%;background:radial-gradient(circle,rgba(77,171,255,.24),transparent 65%);animation:drift 16s ease-in-out infinite alternate}
#app::after{right:-180px;top:45%;background:radial-gradient(circle,rgba(179,136,255,.22),rgba(255,157,42,.1) 45%,transparent 70%);animation:drift2 19s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(160px,120px) scale(1.2)}}
@keyframes drift2{to{transform:translate(-200px,-140px) scale(1.15)}}
/* ticker */
.ticker{overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.45);margin-bottom:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk-track{display:flex;width:max-content;animation:marq 55s linear infinite}
.tk-track span{display:flex;gap:10px;align-items:center;padding:9px 24px;white-space:nowrap;font:800 12px var(--display,sans-serif);letter-spacing:.1em;text-transform:uppercase;color:#eee}
.tk-track i{width:7px;height:7px;transform:rotate(45deg);background:#ff4b3a}
.tk-track span:nth-child(3n+2) i{background:#ffc800}.tk-track span:nth-child(3n) i{background:#2fe0d0}
@keyframes marq{to{transform:translateX(-50%)}}

.tw{display:inline}
